root: /data/how2/clean_code/how2/embeddings
split_tag: final
batch_size: 128
n_epochs: 100
projection_dim: 128
use_video: false
loss: siglip
checkpoint_dir: checkpoints
eval_every: 500
# run-08 optimisation sweep, stage B: around the best stage-A arm (run-08-lr1e-4-wd0.1,
# best val R@5), varying one thing at a time.
lr: 1.0e-4
weight_decay: 0.1
max_steps: 30000
warmup_steps: 5000
patience: 10
min_steps: 5000
