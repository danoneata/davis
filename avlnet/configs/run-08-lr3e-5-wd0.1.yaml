root: /data/how2/clean_code/how2/embeddings
split_tag: final
batch_size: 128
n_epochs: 100
projection_dim: 128
use_video: false
loss: siglip
checkpoint_dir: checkpoints
eval_every: 500
# run-08 optimisation sweep, stage A (lr x weight_decay), from run-06-all. Short
# schedule with early stopping: run-06 arms peaked by step ~9k and then overfit.
lr: 3e-5
weight_decay: 0.1
max_steps: 30000
warmup_steps: 1000
patience: 10
min_steps: 3000
