root: /data/how2/clean_code/how2/embeddings
split_tag: final
batch_size: 128
n_epochs: 100
projection_dim: 128
use_video: false
loss: siglip
checkpoint_dir: checkpoints
eval_every: 500
max_steps: 144400
# Arm 1 of the run-06 lm_score study: every segment, as both positive and negative.
# run-09: segments-per-speaker ablation of run-07-spk-all (16 speakers x 8), now
# 1 speaker x 128 segments per batch. Small speakers give all their segments,
# so a batch can hold a few more speakers than 1.
group_negatives: {by: speaker_id, per_group: 128}
# Early stopping on val r5, same schedule as run-07 so the arms stay comparable:
# run-07-spk-all peaked at step 10,500, and with these settings would have stopped
# at 15,500 with the same best checkpoint.
patience: 10
min_steps: 3000
