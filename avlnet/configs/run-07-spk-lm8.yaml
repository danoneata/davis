root: /data/how2/clean_code/how2/embeddings
split_tag: final
batch_size: 128
n_epochs: 100
projection_dim: 128
use_video: false
loss: siglip
checkpoint_dir: checkpoints
eval_every: 500
max_steps: 144400
# No early stopping: run-05-speaker-full stopped during warmup. The best checkpoint
# is still picked by val r5.
patience: 0
# Arm 2: train only on segments with lm_score >= 8 (63,261), the cut that defines
# the val and dev5 folds.
filter:
  type: from_list
  path: data/filelists/how2_train-final.json
  predicate: {field: lm_score, op: ">=", value: 8}
# run-07: speaker-grouped batches, 16 speakers x 8 segments, so each item has 7
# same-speaker negatives; cross-speaker pairs still count as negatives.
group_negatives: {by: speaker_id, per_group: 8}
