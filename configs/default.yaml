# Example config -- copy this file and edit to make a new experiment, then run:
#   python train.py <this_file's_name_without_.yaml>
# e.g. `python train.py default` for this file.

dataset_name: null
embeddings_path: /mnt/private-share/speechDatabases/how2/processed_how2/embeddings
train_ids_path: /mnt/private-share/speechDatabases/davis-gabi/how2-filtered/train.txt #/mnt/private-share/speechDatabases/how2/processed_how2/train.txt
val_ids_path:  /mnt/private-share/speechDatabases/davis-gabi/how2-filtered/val.txt #/mnt/private-share/speechDatabases/how2/processed_how2/val.txt
test_ids_path:  /mnt/private-share/speechDatabases/davis-gabi/how2-filtered/dev5.txt

# MODEL
image_dim: 768        # DINOv2 image embedding dim
video_feat_dim: 1024  # V-JEPA2 video embedding dim
audio_dim: 768        # WavLM audio embedding dim
embd_dim: 1024         # shared audio-video embedding space dim
normalize: true
image_only: false

# TRAINING PARAMS
batch_size: 256
batch_size_val: 100000 # big value to cover whole validation
lr: 1e-3
lr_decay: 1.0
epochs: 50
seed: 1
num_thread_reader: 8
pretrain_path: null
checkpoint_dir: checkpoints

# LOGGING
n_display: 150
verbose: 1
eval_lang_retrieval: 0
eval_only: False

# CHECKPOINTS & EARLY STOPPING
checkpoint_metric: R@5
checkpoint_mode: max
save_top_n_checkpoints: 3
early_stopping: false
early_stopping_patience: 10
early_stopping_min_delta: 0.0

wandb_project: avlnet-gabi
# ${} interpolation pulls values from elsewhere in this same file, same as OmegaConf
# does in the reference script.
experiment_name: wtf_test #how2-train_both75-val_lm25-dev5_lm25_${batch_size}_${lr}_${epochs}_${embd_dim}